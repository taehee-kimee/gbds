metadata:
  lastUpdated: "2026-10-16"
  status: draft
  notes: |
    Drafted from code (Calendar.tsx, dates.ts, Calendar.module.css) and Figma component sets 7219:10741 / 7219:10714.
    Date select (7219:10905) and Range select (7219:10932) are separate components, not built yet.
    Layer 1 guidelines are a first draft and need design review.
    Open design questions: Review Note 5.
