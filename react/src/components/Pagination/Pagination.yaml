metadata:
  lastUpdated: "2026-10-16"
  status: draft
  notes: |
    2026-10-16: siblingCount/boundaryCount replaced by maxItems (user choice — one total-slot count).
    Drafted from code (Pagination.tsx, Pagination.module.css, range.ts) and Figma component sets 3331:2811, 3641:9731.
    Measured in the playground: items 36 × 36, gap 4, dot row 46 × 6 — matches Figma.
    Open design questions: Review Notes 1–4.
