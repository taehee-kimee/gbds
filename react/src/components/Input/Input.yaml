metadata:
  lastUpdated: "2026-10-16"
  status: draft
  notes: |
    Drafted from code (Input.tsx, Field.tsx, Input.module.css) and Figma sets 520:3062, 5084:3716, 3981:19811.
    Input time and Input phone are type="time" / type="tel" composites (AM/PM toggle and select drawn in place until Toggle / Select exist).
    Open design questions: Review Notes 1–4, 9.
